name: cnblogs-sync
on:
  push:
    branches: [source]
    paths:
      - 'source/_posts/**'
      - 'source/img/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnblogs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Sync
        env:
          CNBLOGS_TOKEN: ${{ secrets.CNBLOGS_TOKEN }}
        run: python3 scripts/cnblogs/sync.py push --new-only
      - name: Persist state
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scripts/cnblogs/state.json scripts/cnblogs/images.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(cnblogs): update sync state'
          git push
